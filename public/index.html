<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miitel Demo App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f9;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
    }
    button.logout {
      background: #dc2626;
    }
    .status {
      padding: 10px 14px;
      border-radius: 8px;
      background: white;
      border: 1px solid #ddd;
      margin-bottom: 16px;
    }
    .log {
      background: #111827;
      color: #f9fafb;
      border-radius: 8px;
      padding: 12px;
      min-height: 120px;
      white-space: pre-wrap;
      margin-bottom: 16px;
      font-family: monospace;
      font-size: 12px;
    }
    iframe {
      width: 100%;
      height: 720px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>
  <h2>Miitel Demo App</h2>

  <div class="toolbar">
    <button id="loginBtn" type="button">Login</button>
    <button id="logoutBtn" type="button" class="logout">Logout</button>
  </div>

  <div class="status" id="status">Status: Not logged in</div>
  <div class="log" id="logBox">Page loaded.
</div>

  <div id="iframeContainer">
    <iframe id="miitelFrame" src="about:blank" title="Miitel Dashboard"></iframe>
  </div>

  <script>
    const logBox = document.getElementById("logBox");
    const statusBox = document.getElementById("status");

    function log(message) {
      console.log(message);
      logBox.textContent += message + "\n";
    }

    // All /_auth requests must include X-Requested-With for CSRF protection
    const CSRF_HEADERS = {
      "Content-Type": "application/json",
      "X-Requested-With": "XMLHttpRequest",
    };

    // Fetch tokens from server and set localStorage so the MiiTel SPA can read them.
    // Parent page and iframe share localStorage because the proxy makes them same-origin.
    async function setMiitelTokens() {
      const res = await fetch("/_auth/tokens", {
        method: "POST",
        headers: CSRF_HEADERS,
        credentials: "same-origin",
      });
      if (!res.ok) return false;
      const tokens = await res.json();
      localStorage.setItem("access_token", tokens.access_token);
      localStorage.setItem("refresh_token", tokens.refresh_token);
      localStorage.setItem("refresh_token_expires_at", tokens.refresh_token_expires_at);
      if (tokens.id_token) {
        localStorage.setItem("id_token", tokens.id_token);
      }
      return true;
    }

    // Destroy and recreate the iframe to fully kill the SPA's in-memory state.
    // Just changing src leaves the old JS running with stale tokens.
    function resetIframe(src) {
      const container = document.getElementById("iframeContainer");
      container.innerHTML = "";
      const iframe = document.createElement("iframe");
      iframe.id = "miitelFrame";
      iframe.title = "Miitel Dashboard";
      iframe.src = src;
      container.appendChild(iframe);
    }

    function loadDashboard() {
      resetIframe("/app/dashboard?ts=" + Date.now());
    }

    async function login() {
      try {
        log("Login button clicked.");
        statusBox.textContent = "Status: Sending login request...";

        const res = await fetch("/_auth/login", {
          method: "POST",
          headers: CSRF_HEADERS,
        });

        log("Response status: " + res.status);

        if (!res.ok) {
          const errText = await res.text();
          log("Error: " + errText);
          statusBox.textContent = "Status: Login failed";
          return;
        }

        const data = await res.json();
        log("Login successful. Token expires in " + data.expires_in + "s");

        // Set localStorage tokens first, then create a fresh iframe
        await setMiitelTokens();
        // Track expiry so we can detect auto-refresh later
        const statusRes = await fetch("/_auth/status", { method: "POST", headers: CSRF_HEADERS });
        const statusData = await statusRes.json();
        lastExpiresAt = statusData.expiresAt || 0;
        log("Tokens set in localStorage for MiiTel SPA.");
        statusBox.textContent = "Status: Logged in";
        loadDashboard();

      } catch (err) {
        log("ERROR: " + err.message);
        statusBox.textContent = "Status: Error";
      }
    }

    async function logout() {
      await fetch("/_auth/logout", { method: "POST", headers: CSRF_HEADERS });
      localStorage.removeItem("access_token");
      localStorage.removeItem("refresh_token");
      localStorage.removeItem("refresh_token_expires_at");
      localStorage.removeItem("id_token");
      // Destroy iframe completely to kill SPA's in-memory state
      resetIframe("/app/login");
      statusBox.textContent = "Status: Not logged in";
      log("Logged out. Cookies and localStorage cleared.");
    }

    async function checkAuth() {
      try {
        const res = await fetch("/_auth/status", {
          method: "POST",
          headers: CSRF_HEADERS,
        });
        const data = await res.json();
        if (data.loggedIn) {
          statusBox.textContent = "Status: Logged in (session active)";
          await setMiitelTokens();
          loadDashboard();
          log("Existing session detected.");
        }
      } catch (e) {
        // ignore
      }
    }

    // Periodically check token status and log when auto-refresh happens
    let lastExpiresAt = 0;
    async function pollTokenStatus() {
      try {
        const res = await fetch("/_auth/status", {
          method: "POST",
          headers: CSRF_HEADERS,
        });
        const data = await res.json();
        if (data.loggedIn && lastExpiresAt && data.expiresAt > lastExpiresAt) {
          log("Token auto-refreshed. New expiry: " + new Date(data.expiresAt).toLocaleTimeString());
          await setMiitelTokens();
          log("localStorage tokens updated after refresh.");
        }
        if (data.loggedIn) {
          lastExpiresAt = data.expiresAt;
        }
      } catch (e) {
        // ignore
      }
    }
    // Check every 60 seconds
    setInterval(pollTokenStatus, 60 * 1000);

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("logoutBtn").addEventListener("click", logout);
    checkAuth();
    log("Ready.");
  </script>
</body>
</html>
