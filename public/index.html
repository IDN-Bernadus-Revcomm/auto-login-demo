<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miitel Demo App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f9;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
    }
    button.logout {
      background: #dc2626;
    }
    .status {
      padding: 10px 14px;
      border-radius: 8px;
      background: white;
      border: 1px solid #ddd;
      margin-bottom: 16px;
    }
    .log {
      background: #111827;
      color: #f9fafb;
      border-radius: 8px;
      padding: 12px;
      min-height: 120px;
      white-space: pre-wrap;
      margin-bottom: 16px;
      font-family: monospace;
      font-size: 12px;
    }
    iframe {
      width: 100%;
      height: 720px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>
  <h2>Miitel Demo App</h2>

  <div class="toolbar">
    <button id="loginBtn" type="button">Login</button>
    <button id="logoutBtn" type="button" class="logout">Logout</button>
  </div>

  <div class="status" id="status">Status: Not logged in</div>
  <div class="log" id="logBox">Page loaded.
</div>

  <iframe
    id="miitelFrame"
    src="/app/login"
    title="Miitel Dashboard">
  </iframe>

  <script>
    const logBox = document.getElementById("logBox");
    const statusBox = document.getElementById("status");

    function log(message) {
      console.log(message);
      logBox.textContent += message + "\n";
    }

    // All /_auth requests must include X-Requested-With for CSRF protection
    const CSRF_HEADERS = {
      "Content-Type": "application/json",
      "X-Requested-With": "XMLHttpRequest",
    };

    // Fetch tokens from server and set localStorage so the MiiTel SPA can read them.
    // Parent page and iframe share localStorage because the proxy makes them same-origin.
    async function setMiitelTokens() {
      const res = await fetch("/_auth/tokens", {
        method: "POST",
        headers: CSRF_HEADERS,
        credentials: "same-origin",
      });
      if (!res.ok) return false;
      const tokens = await res.json();
      localStorage.setItem("access_token", tokens.access_token);
      localStorage.setItem("refresh_token", tokens.refresh_token);
      localStorage.setItem("refresh_token_expires_at", tokens.refresh_token_expires_at);
      localStorage.setItem("MT_currentAccess", String(Date.now()));
      return true;
    }

    function loadDashboard() {
      document.getElementById("miitelFrame").src =
        "/app/dashboard?ts=" + Date.now();
    }

    async function login() {
      try {
        log("Login button clicked.");
        statusBox.textContent = "Status: Sending login request...";

        const res = await fetch("/_auth/login", {
          method: "POST",
          headers: CSRF_HEADERS,
        });

        log("Response status: " + res.status);

        if (!res.ok) {
          const errText = await res.text();
          log("Error: " + errText);
          statusBox.textContent = "Status: Login failed";
          return;
        }

        const data = await res.json();
        log("Login successful. Token expires in " + data.expires_in + "s");

        // Set localStorage tokens, then load dashboard in iframe
        await setMiitelTokens();
        log("Tokens set in localStorage for MiiTel SPA.");
        statusBox.textContent = "Status: Logged in";
        loadDashboard();

      } catch (err) {
        log("ERROR: " + err.message);
        statusBox.textContent = "Status: Error";
      }
    }

    async function logout() {
      await fetch("/_auth/logout", { method: "POST", headers: CSRF_HEADERS });
      localStorage.removeItem("access_token");
      localStorage.removeItem("refresh_token");
      localStorage.removeItem("refresh_token_expires_at");
      localStorage.removeItem("MT_currentAccess");
      document.getElementById("miitelFrame").src = "/app/login";
      statusBox.textContent = "Status: Not logged in";
      log("Logged out. Cookies and localStorage cleared.");
    }

    async function checkAuth() {
      try {
        const res = await fetch("/_auth/status", {
          method: "POST",
          headers: CSRF_HEADERS,
        });
        const data = await res.json();
        if (data.loggedIn) {
          statusBox.textContent = "Status: Logged in (session active)";
          await setMiitelTokens();
          loadDashboard();
          log("Existing session detected.");
        }
      } catch (e) {
        // ignore
      }
    }

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("logoutBtn").addEventListener("click", logout);
    checkAuth();
    log("Ready.");
  </script>
</body>
</html>
