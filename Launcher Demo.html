<!DOCTYPE html>
<html>
<head>
  <title>Miitel Auto Login Demo</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    iframe {
      width: 100%;
      height: 700px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

<h2>Miitel Auto Login Demo</h2>

<button onclick="login()">Login</button>

<br>

<iframe id="miitelFrame"></iframe>

<script>

const TENANT = "trial0195-id"
const EMAIL = "agent.qiscus1@qisc.us"
const PASSWORD = "Semuabisa123!"

async function login() {

  const response = await fetch(`https://${TENANT}.miitel.jp/api/auth/v2/authenticate`, {
    method: "POST",
    headers: {
      "accept": "application/json",
      "content-type": "application/json"
    },
    body: JSON.stringify({
      flow: "TENANT_USER_PASSWORD",
      params: {
        tenant_code: TENANT,
        email: EMAIL,
        password: PASSWORD
      }
    })
  })

  const data = await response.json()

  const auth = data.auth_result

  console.log("Token received:", auth)

  // store tokens (like Miitel widget does)
  localStorage.setItem("access_token", auth.access_token)
  localStorage.setItem("refresh_token", auth.refresh_token)

  localStorage.setItem("refresh_token_expires_at",
    Math.floor(Date.now()/1000) + auth.expires_in
  )

  localStorage.setItem("MT_currentAccess", Date.now())

  // open miitel dashboard
  document.getElementById("miitelFrame").src =
    `https://${TENANT}.miitel.jp/app/dashboard`

}

</script>

</body>
</html>
